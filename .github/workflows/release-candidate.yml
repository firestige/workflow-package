name: Workflow assets candidate

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        required: true
        type: string
      contract_ref:
        description: Exact system-contracts revision used for conformance
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_tag:
        required: true
        type: string
      contract_ref:
        required: true
        type: string

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release trigger branch
        run: test "$GITHUB_REF_NAME" = "release/next"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - name: Check out frozen Workflow Contract
        uses: actions/checkout@v6
        with:
          repository: firestige/system-contracts
          ref: ${{ inputs.contract_ref }}
          path: system-contracts
      - name: Verify exact Workflow Contract revision
        env:
          CONTRACT_REF: ${{ inputs.contract_ref }}
        run: |
          echo "$CONTRACT_REF" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git -C system-contracts rev-parse HEAD)" = "$CONTRACT_REF"
      - name: Run acceptance
        run: |
          npm --prefix system-contracts/workflow-dsl ci
          node system-contracts/workflow-dsl/tools/check-example.cjs implementation/definition
          node system-contracts/workflow-dsl/tools/check-example.cjs system-design/definition
          node system-contracts/workflow-dsl/tools/run-conformance.cjs implementation/definition
          node system-contracts/workflow-dsl/tools/run-conformance.cjs system-design/definition
          node --test test/tooling/release/release.test.cjs
      - name: Build and verify exact assets
        env:
          CONTRACT_REF: ${{ inputs.contract_ref }}
        run: |
          node release/cli/release.cjs build "$RUNNER_TEMP/local-release" "$GITHUB_SHA" "$CONTRACT_REF"
          node release/cli/release.cjs qualify "$RUNNER_TEMP/local-release" system-contracts/workflow-dsl
      - name: Create and requalify RC
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          ! gh release view "$CANDIDATE_TAG"
          ! git ls-remote --exit-code --tags origin "refs/tags/$CANDIDATE_TAG"
          gh release create "$CANDIDATE_TAG" "$RUNNER_TEMP/local-release/"* --prerelease --target "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/remote-release"
          gh release download "$CANDIDATE_TAG" --dir "$RUNNER_TEMP/remote-release"
          node release/cli/release.cjs qualify "$RUNNER_TEMP/remote-release" system-contracts/workflow-dsl
          cmp "$RUNNER_TEMP/local-release/release-metadata.json" "$RUNNER_TEMP/remote-release/release-metadata.json"
      - name: Attach qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          export CANDIDATE_TAG
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),path=require("node:path"); const p=process.env.RUNNER_TEMP,m=fs.readFileSync(path.join(p,"remote-release/release-metadata.json")); fs.writeFileSync(path.join(p,"release-qualification.json"),JSON.stringify({schemaVersion:"wsr.release-qualification@1.0.0",candidateTag:process.env.CANDIDATE_TAG,commit:process.env.GITHUB_SHA,artifactMetadataSha256:"sha256:"+crypto.createHash("sha256").update(m).digest("hex"),localAcceptance:{status:"PASS"},remoteQualification:{status:"PASS"}},null,2)+"\n")'
          gh release upload "$CANDIDATE_TAG" "$RUNNER_TEMP/release-qualification.json"
